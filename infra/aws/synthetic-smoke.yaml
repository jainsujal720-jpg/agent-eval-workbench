AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  One-shot synthetic-only AgentEval ECS Fargate smoke test. This uses an
  existing public subnet and has no inbound security-group rules. Do not use
  this template with company or customer data.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing default VPC ID in the selected AWS Region.
  VpcCidr:
    Type: String
    Description: CIDR block of the selected VPC, used only for DNS egress.
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$'
    ConstraintDescription: Enter a valid IPv4 CIDR, such as 172.31.0.0/16.

Resources:
  ImageRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RepositoryName: !Sub 'agenteval-synthetic-smoke-${AWS::AccountId}'
      EmptyOnDelete: true
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the latest smoke-test image",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 1
                },
                "action": {"type": "expire"}
              }
            ]
          }

  SmokeLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: /agenteval/synthetic-smoke
      RetentionInDays: 3

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No inbound access; outbound HTTPS and VPC DNS for the synthetic task.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS for ECR image pull and CloudWatch Logs.
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: !Ref VpcCidr
          Description: DNS queries to the VPC resolver.
        - IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: !Ref VpcCidr
          Description: DNS over TCP to the VPC resolver.

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PullSmokeImageAndWriteSmokeLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !GetAtt ImageRepository.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${SmokeLogGroup.Arn}:*'

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: agenteval-synthetic-smoke

  SmokeTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: agenteval-synthetic-smoke
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: session-eval
          Image: !Sub '${ImageRepository.RepositoryUri}:smoke'
          Essential: true
          Command:
            - python
            - -m
            - app.session_eval
            - --target
            - local
            - --benchmark
            - benchmarks/support_failures.jsonl
            - --output
            - /app/reports/aws-synthetic-smoke.json
            - --summary-only
          Environment:
            - Name: AGENTEVAL_PROVIDER
              Value: demo
            - Name: PYTHONDONTWRITEBYTECODE
              Value: '1'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref SmokeLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: synthetic-smoke

Outputs:
  RepositoryUri:
    Description: Private ECR repository URI for the synthetic smoke image.
    Value: !GetAtt ImageRepository.RepositoryUri
  ClusterName:
    Description: ECS cluster for the one-shot synthetic task.
    Value: !Ref Cluster
  TaskDefinitionArn:
    Description: ECS Fargate task definition.
    Value: !Ref SmokeTaskDefinition
  SecurityGroupId:
    Description: Security group with no inbound rules.
    Value: !GetAtt TaskSecurityGroup.GroupId
  LogGroupName:
    Description: CloudWatch log group with three-day retention.
    Value: !Ref SmokeLogGroup
