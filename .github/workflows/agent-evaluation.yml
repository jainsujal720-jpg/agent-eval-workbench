name: Agent evaluation gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evaluate-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Run agent benchmark and release gate
        run: python -m app.evaluate --benchmark benchmarks/support.jsonl --output reports/ci-report.json
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-evaluation-report
          path: reports/ci-report.json
          if-no-files-found: ignore
