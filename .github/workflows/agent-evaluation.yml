name: Agent evaluation gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evaluate-agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - name: Unit and regression tests
        run: AGENTEVAL_PROVIDER=demo python -m unittest discover -s tests -v
      - name: Run release benchmark
        run: AGENTEVAL_PROVIDER=demo python -m app.evaluate --benchmark benchmarks/support.jsonl --output reports/ci-support.json
      - name: Run conversation authorization benchmark
        run: AGENTEVAL_PROVIDER=demo python -m app.session_eval --benchmark benchmarks/support_sessions.jsonl --output reports/ci-sessions.json
      - name: Run tool failure benchmark
        run: AGENTEVAL_PROVIDER=demo python -m app.session_eval --benchmark benchmarks/support_failures.jsonl --output reports/ci-failures.json
      - name: Record stress benchmark baseline (known demo-agent failures)
        if: always()
        continue-on-error: true
        run: AGENTEVAL_PROVIDER=demo python -m app.evaluate --benchmark benchmarks/support_stress.jsonl --output reports/ci-stress-baseline.json
      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agent-evaluation-reports
          path: reports/ci-*.json
          if-no-files-found: ignore

  docker-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the synthetic demo image
        run: docker build --tag agenteval-space:ci .
      - name: Start the container and check the demo pages
        run: |
          docker run --detach --rm --name agenteval-space-ci \
            --publish 127.0.0.1:7860:7860 agenteval-space:ci
          trap 'docker stop agenteval-space-ci >/dev/null 2>&1 || true' EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7860/benchmarks \
              --output /tmp/agenteval-benchmarks.html; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          grep --quiet 'Validate and preview' /tmp/agenteval-benchmarks.html
          curl --fail --silent http://127.0.0.1:7860/sample-benchmark \
            --output /tmp/agenteval-sample.jsonl
          test -s /tmp/agenteval-sample.jsonl
